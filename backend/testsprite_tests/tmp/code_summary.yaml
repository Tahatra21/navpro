version: "2"
type: backend
tech_stack:
  - javascript
  - express
  - postgresql
  - nodejs
features:
  - name: Authentication API
    description: User authentication, registration, session management and password updates.
    files:
      - src/routes/auth.js
    endpoints:
      - method: POST
        path: /api/v1/auth/login
        description: Authenticate user credentials and return a JWT token.
        auth_required: false
        response_schema:
          "200": object
          "400": object
          "401": object
      - method: POST
        path: /api/v1/auth/logout
        description: Log out the current user and log the audit event.
        auth_required: true
        response_schema:
          "200": object
      - method: GET
        path: /api/v1/auth/me
        description: Get details of the currently authenticated user.
        auth_required: true
        response_schema:
          "200": object
          "401": object
      - method: PATCH
        path: /api/v1/auth/me
        description: Update full name of the currently authenticated user.
        auth_required: true
        request_schema:
          body:
            full_name: string
        response_schema:
          "200": object
          "400": object
      - method: PATCH
        path: /api/v1/auth/password
        description: Change password for the currently authenticated user.
        auth_required: true
        request_schema:
          body:
            current_password: string
            new_password: string
        response_schema:
          "200": object
          "400": object
          "401": object
known_limitations: []
